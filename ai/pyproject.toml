[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ms-monitor-ai"
version = "0.1.0"
description = "Risk classification model for MS-Monitor"
requires-python = ">=3.11"
dependencies = [
  "joblib==1.5.2",
  "numpy==2.3.3",
  "pandas==2.3.3",
  "scikit-learn==1.7.2",
]

[tool.setuptools.packages.find]
where = ["."]
